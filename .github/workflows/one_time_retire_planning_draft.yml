name: One-time retirement of privately archived planning draft
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_retire_planning_draft.yml'
permissions:
  contents: write
jobs:
  retire:
    if: github.repository == 'yumorepos/yumorepos.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact expected stale ref only after PR closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          root="https://api.github.com/repos/yumorepos/yumorepos.github.io"
          branch="planning/aviation-portfolio-program-2026-11-09"
          expected="c39ee8275405d29e8f6c5d784d6d4f2cd7a94324"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          def call(path,method="GET"):
              req=urllib.request.Request(root+path,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as rsp:
                  return json.load(rsp) if method=="GET" else None
          repo=call("")
          pr=call("/pulls/2")
          if repo["default_branch"]!="main" or pr["state"]!="closed" or pr["merged"]:
              raise SystemExit("Safety stop: default branch or PR status changed")
          if branch=="main" or len(expected)!=40:
              raise SystemExit("Invalid retirement target")
          path="/git/ref/heads/"+urllib.parse.quote(branch,safe="/")
          ref=call(path)
          if ref["object"]["sha"]!=expected:
              raise SystemExit("Safety stop: branch moved. Preserve new work.")
          call(path.replace("/git/ref/heads/","/git/refs/heads/",1),method="DELETE")
          remaining=[b["name"] for b in call("/branches?per_page=100")]
          if remaining!=["main"]:
              raise SystemExit("Unexpected branch list: "+repr(remaining))
          print("Verified: only main remains; closed PR #2 was NOT merged.")
          PY
