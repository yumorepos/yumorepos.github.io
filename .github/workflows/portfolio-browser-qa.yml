# Bounded browser/viewport QA. No publication, new app or data fetch.
name: Portfolio viewport and navigation QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned headless browser tool
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify four static pages at three viewport widths
        run: python scripts/portfolio_browser_qa.py --output browser_qa_artifacts
      - name: Upload screenshot and geometric QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: browser_qa_artifacts/
          retention-days: 14
          if-no-files-found: warn
